name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      build_path:
        description: 'Build path to test (on push/PR only builtin runs by default)'
        required: true
        default: 'builtin'
        type: choice
        options:
          - builtin
          - system
          - everything
      ref_source:
        description: 'Reference source for golden files'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - custom
          - none
      ref_branch:
        description: 'Reference branch name (only used when ref_source is "custom"; ignored otherwise)'
        required: false
        default: 'main'
        type: string
      force_regen:
        description: 'Force re-generation of reference golden files'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new push arrives.
# workflow_dispatch runs are never cancelled (each gets a unique group via
# run_id) so that manually triggered validations don't interfere with each
# other or with concurrent push-triggered runs.
concurrency:
  group: >-
    ci-${{
      github.event_name == 'workflow_dispatch'
        && github.run_id
        || github.ref
    }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # ---------------------------------------------------------------------------
  # Reference Generation Jobs
  #
  # Build the project from the reference branch (default: main), run the
  # standard event-generation config, and cache the stripped HepMC3 output.
  # The test jobs restore this cache to perform byte-for-byte physics
  # validation via diff.
  #
  # On push/pull_request the reference is always generated from main.
  # On workflow_dispatch the caller can choose main, a custom branch, or
  # 'none' (skip physics validation entirely).
  #
  # macOS reference generation runs only on workflow_dispatch because macOS
  # runners bill at ~10x the Linux rate.
  # ---------------------------------------------------------------------------

  ref-linux:
    name: Reference (Linux)
    # Skip only when the caller has explicitly opted out of physics validation.
    # On push/PR, github.event.inputs.ref_source is null, so the condition
    # evaluates to true and the job runs.
    if: github.event.inputs.ref_source != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cache_key: ${{ steps.compute-key.outputs.cache-key }}
    steps:
      # This job's ONLY other checkout is of the REFERENCE branch, which does
      # not contain .github/golden-filters.txt -- the file is new on the
      # branch under test. Checking this branch out first, and staging the
      # filters outside the workspace, is what makes them available after the
      # reference checkout replaces everything.
      #
      # It also has to happen before "Compute cache key": hashFiles() reads
      # the workspace, so with no checkout it silently returned an empty
      # string and the filter hash never entered the key at all.
      - name: Check out this branch (for the golden filters)
        uses: actions/checkout@v5

      - name: Stage the golden filters
        run: |
          src="${GITHUB_WORKSPACE}/.github/golden-filters.txt"
          dst="${RUNNER_TEMP}/golden-patterns.txt"
          if [ ! -s "${src}" ]; then
            echo "ERROR: ${src} is missing or empty" >&2
            exit 1
          fi
          # Strip comments and blanks ONCE, here, and verify the result is
          # non-empty. grep -f treats an empty pattern as matching every
          # line, so an empty pattern file would filter both the golden and
          # the current output down to nothing and make diff pass vacuously.
          grep -v -e '^#' -e '^$' "${src}" > "${dst}"
          if [ ! -s "${dst}" ]; then
            echo "ERROR: ${src} contains no filter patterns" >&2
            exit 1
          fi
          echo "--- active filter patterns ---"
          cat "${dst}"

      - name: Determine reference branch
        id: ref_branch
        env:
          REF_SOURCE: ${{ github.event.inputs.ref_source }}
          REF_BRANCH: ${{ github.event.inputs.ref_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GH_REF: ${{ github.ref }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [[ "${REF_SOURCE}" == "custom" ]]; then
            # Dispatch with an explicit custom reference branch.
            echo "branch=${REF_BRANCH}" >> "$GITHUB_OUTPUT"
            echo "ref=${REF_BRANCH}" >> "$GITHUB_OUTPUT"
          elif [[ "${EVENT_NAME}" == "push" && "${GH_REF}" == "refs/heads/main" ]]; then
            # Push directly to main: use the pre-push SHA as the reference so
            # we compare the incoming commit(s) against the prior state of main
            # rather than against themselves (which would be a tautology).
            # On the very first push to main BEFORE_SHA is the null SHA; fall
            # back to the current SHA in that case (tautology is unavoidable).
            if [[ "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "ref=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
            else
              echo "branch=main" >> "$GITHUB_OUTPUT"
              echo "ref=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
            fi
          else
            # Default for push to develop, pull_request, and dispatch with
            # ref_source == 'main': generate from the current tip of main.
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute cache key
        id: compute-key
        # Key on the HEAD SHA of the *reference ref*, not github.sha (which is
        # the triggering commit and differs on every push to develop).  Two
        # develop pushes sharing the same main HEAD reuse the same cached golden
        # file.  On a push to main the ref is the pre-push SHA (set above), so
        # the key is stable and distinct from the incoming commit.
        # force_regen overrides this with run_id+run_attempt, which is always
        # unique and therefore always produces a fresh cache entry.
        # The resolved SHA is also emitted as 'ref-sha' so that the checkout
        # step uses the exact same commit, eliminating any race between
        # ls-remote and the subsequent git fetch.
        env:
          REF: ${{ steps.ref_branch.outputs.ref }}
        run: |
          if [[ "${{ github.event.inputs.force_regen }}" == "true" ]]; then
            suffix="${{ github.run_id }}-${{ github.run_attempt }}"
            # For force_regen the cache key is unique; still need a SHA for
            # checkout.  Resolve the branch name (or use the SHA directly).
            if [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
              ref_sha="${REF}"
            else
              ref_sha=$(git ls-remote "${{ github.server_url }}/${{ github.repository }}" \
                "refs/heads/${REF}" | cut -f1)
              if [[ -z "${ref_sha}" ]]; then
                echo "ERROR: branch '${REF}' not found" >&2
                exit 1
              fi
            fi
          elif [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
            # ref is already a full SHA (push-to-main case) — use it directly.
            ref_sha="${REF}"
            suffix="${ref_sha}"
          else
            # ref is a branch name — resolve its current HEAD SHA once and use
            # the same value for both the cache key and the checkout ref.
            ref_sha=$(git ls-remote "${{ github.server_url }}/${{ github.repository }}" \
              "refs/heads/${REF}" | cut -f1)
            if [[ -z "${ref_sha}" ]]; then
              echo "ERROR: branch '${REF}' not found" >&2
              exit 1
            fi
            suffix="${ref_sha}"
          fi
          # The golden file is only comparable to a current file filtered
          # the same way, so the filter's content belongs in the key. Before
          # this, editing .github/golden-filters.txt produced a current file
          # filtered one way and a cached golden file filtered another --
          # which is why such an edit previously had to land on its own.
          # hashFiles is used rather than sha256sum because the macOS runners
          # do not have that command.
          filters="${{ hashFiles('.github/golden-filters.txt') }}"
          echo "cache-key=ref-linux-${{ steps.ref_branch.outputs.branch }}-${suffix}-${filters:0:12}" \
            >> "$GITHUB_OUTPUT"
          echo "ref-sha=${ref_sha}" >> "$GITHUB_OUTPUT"

      - name: Restore cached reference file
        id: restore-cache
        uses: actions/cache@v5
        with:
          path: golden-linux.hepmc3
          key: ${{ steps.compute-key.outputs.cache-key }}
          restore-keys: |
            ref-linux-${{ steps.ref_branch.outputs.branch }}-

      - name: Check out reference branch
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.compute-key.outputs.ref-sha }}
          fetch-depth: 1

      - name: Build reference binary
        if: steps.restore-cache.outputs.cache-hit != 'true'
        # Use fully built-in deps so the golden file represents canonical
        # MARLEY output independent of any system library versions.  This
        # means the system-path test legs compare against the same reference,
        # which is intentional: regressions introduced by upstream library
        # changes will surface as diff failures there.
        run: make IGNORE_ROOT=1 IGNORE_GSL=1 IGNORE_HEPMC3=1

      - name: Generate reference events
        if: steps.restore-cache.outputs.cache-hit != 'true'
        env:
          MARLEY: ${{ github.workspace }}
        run: |
          ./build/bin/marley generate examples/config/COPY_ME.js
          # Comments and blanks stripped first: grep -f treats an empty
          # pattern as matching every line, which would filter both files
          # to nothing and make diff pass vacuously.
          grep -v -f "${RUNNER_TEMP}/golden-patterns.txt" \
            events.hepmc3 > golden-linux.hepmc3

  ref-macos:
    name: Reference (macOS)
    # macOS runners are expensive, so this used to be workflow_dispatch only.
    # The macOS built-in leg now runs on public pull requests, and without a
    # golden file to compare against it would have nothing to validate -- so
    # this gate has to track the matrix rule rather than stay behind it.
    if: >-
      github.event.inputs.ref_source != 'none' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.repository.private == false)
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      cache_key: ${{ steps.compute-key.outputs.cache-key }}
    steps:
      # This job's ONLY other checkout is of the REFERENCE branch, which does
      # not contain .github/golden-filters.txt -- the file is new on the
      # branch under test. Checking this branch out first, and staging the
      # filters outside the workspace, is what makes them available after the
      # reference checkout replaces everything.
      #
      # It also has to happen before "Compute cache key": hashFiles() reads
      # the workspace, so with no checkout it silently returned an empty
      # string and the filter hash never entered the key at all.
      - name: Check out this branch (for the golden filters)
        uses: actions/checkout@v5

      - name: Stage the golden filters
        run: |
          src="${GITHUB_WORKSPACE}/.github/golden-filters.txt"
          dst="${RUNNER_TEMP}/golden-patterns.txt"
          if [ ! -s "${src}" ]; then
            echo "ERROR: ${src} is missing or empty" >&2
            exit 1
          fi
          # Strip comments and blanks ONCE, here, and verify the result is
          # non-empty. grep -f treats an empty pattern as matching every
          # line, so an empty pattern file would filter both the golden and
          # the current output down to nothing and make diff pass vacuously.
          grep -v -e '^#' -e '^$' "${src}" > "${dst}"
          if [ ! -s "${dst}" ]; then
            echo "ERROR: ${src} contains no filter patterns" >&2
            exit 1
          fi
          echo "--- active filter patterns ---"
          cat "${dst}"

      - name: Determine reference branch
        id: ref_branch
        env:
          REF_SOURCE: ${{ github.event.inputs.ref_source }}
          REF_BRANCH: ${{ github.event.inputs.ref_branch }}
        run: |
          if [[ "${REF_SOURCE}" == "custom" ]]; then
            echo "branch=${REF_BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute cache key
        id: compute-key
        # Same rationale as ref-linux: resolve the branch to a SHA once and
        # use that same SHA for both the cache key and the checkout ref,
        # eliminating any race between ls-remote and the subsequent git fetch.
        env:
          BRANCH: ${{ steps.ref_branch.outputs.branch }}
        run: |
          ref_sha=$(git ls-remote "${{ github.server_url }}/${{ github.repository }}" \
            "refs/heads/${BRANCH}" | cut -f1)
          if [[ -z "${ref_sha}" ]]; then
            echo "ERROR: branch '${BRANCH}' not found" >&2
            exit 1
          fi
          if [[ "${{ github.event.inputs.force_regen }}" == "true" ]]; then
            suffix="${{ github.run_id }}-${{ github.run_attempt }}"
          else
            suffix="${ref_sha}"
          fi
          # See the Linux job for why the filter hash is part of the key.
          filters="${{ hashFiles('.github/golden-filters.txt') }}"
          echo "cache-key=ref-macos-${BRANCH}-${suffix}-${filters:0:12}" >> "$GITHUB_OUTPUT"
          echo "ref-sha=${ref_sha}" >> "$GITHUB_OUTPUT"

      - name: Restore cached reference file
        id: restore-cache
        uses: actions/cache@v5
        with:
          path: golden-macos.hepmc3
          key: ${{ steps.compute-key.outputs.cache-key }}
          restore-keys: |
            ref-macos-${{ steps.ref_branch.outputs.branch }}-

      - name: Check out reference branch
        if: steps.restore-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.compute-key.outputs.ref-sha }}
          fetch-depth: 1

      - name: Build reference binary
        if: steps.restore-cache.outputs.cache-hit != 'true'
        # Same rationale as ref-linux: fully built-in deps for a canonical
        # golden file independent of system library versions.
        run: make IGNORE_ROOT=1 IGNORE_GSL=1 IGNORE_HEPMC3=1

      - name: Generate reference events
        if: steps.restore-cache.outputs.cache-hit != 'true'
        env:
          MARLEY: ${{ github.workspace }}
        run: |
          ./build/bin/marley generate examples/config/COPY_ME.js
          grep -v -f "${RUNNER_TEMP}/golden-patterns.txt" \
            events.hepmc3 > golden-macos.hepmc3

  # ---------------------------------------------------------------------------
  # Main Build / Test Matrix
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.name }}
    needs: [ref-linux, ref-macos]
    timeout-minutes: 60
    # always() is required so that test jobs proceed when ref-macos is skipped
    # (the normal push/PR case).  The ref-linux guard blocks all test jobs if
    # the Linux reference build genuinely fails.
    # NOTE: matrix context is not available in job-level if: expressions, so
    # matrix-dependent filtering (macOS dispatch-only, build_path selection)
    # is handled by the "Check matrix eligibility" guard step below.
    if: always() && needs.ref-linux.result != 'failure'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Linux: builtin path (all optional deps disabled) ---
          - name: "Linux · Built-in"
            os: ubuntu-latest
            path: builtin
            root_source: ""
            build: cmake
            cxx: g++
            flags: "IGNORE_ROOT=1 IGNORE_GSL=1 IGNORE_HEPMC3=1"
            libdir: ""
            ref_job: ref-linux
            golden: golden-linux.hepmc3
            current: current-linux.hepmc3

          # --- Linux: ROOT with the VENDORED HepMC3 ---
          # A combination the old matrix could not reach on any event type,
          # because it coupled ROOT to the system path. It is precisely where
          # the vendored include root, the builtin install interface and the
          # dictionary's -I flags all operate at once: the built-in-HepMC3
          # dictionary had never been built in CI at all.
          - name: "Linux · ROOT + built-in HepMC3"
            os: ubuntu-latest
            path: root-builtin
            root_source: "conda"
            build: cmake
            cxx: g++
            flags: "IGNORE_GSL=1 IGNORE_HEPMC3=1"
            libdir: ""
            ref_job: ref-linux
            golden: golden-linux.hepmc3
            current: current-linux.hepmc3

          # --- Linux: system path (GSL + HepMC3 + ROOT from package manager) ---
          # libdir=lib64 makes this the distro-like configuration, so the
          # install-directory override is exercised on every PR rather than
          # rotting. The front-door Makefile translates it to
          # -DCMAKE_INSTALL_LIBDIR, so this also tests the translation.
          - name: "Linux · System"
            os: ubuntu-latest
            path: system
            root_source: "conda"
            build: cmake
            cxx: g++
            flags: ""
            libdir: "libdir=lib64"
            ref_job: ref-linux
            golden: golden-linux.hepmc3
            current: current-linux.hepmc3

          # --- Linux: the hand-written GNU Make recipe ---
          # One dedicated leg rather than doubling the matrix: the build
          # system is a property of the leg, not a second axis. Without it
          # make/build.mk never runs in automation at all. It carries
          # libdir=lib64 too, which is what makes the claim of a common
          # install-directory predicate checked rather than asserted.
          - name: "Linux · Make"
            os: ubuntu-latest
            path: builtin
            root_source: ""
            build: make
            cxx: g++
            flags: "IGNORE_CMAKE=1 IGNORE_ROOT=1 IGNORE_GSL=1 IGNORE_HEPMC3=1"
            libdir: "libdir=lib64"
            ref_job: ref-linux
            golden: golden-linux.hepmc3
            current: current-linux.hepmc3

          # --- Linux: GNU Make, with ROOT and an EXTERNAL HepMC3 ---
          # The combination build.mk is least covered for. The existing Make
          # leg disables every optional dependency, so until now CI never
          # built the ROOT dictionary through build.mk, never exercised its
          # C++-standard maximum against ROOT's own -std, and never linked a
          # system HepMC3 with it. It also makes the
          # "-DMARLEY_FOUND_HEPMC3 must not reach published flags"
          # assertion meaningful on the Make path, where it was previously
          # vacuous because the switch was never defined in the first place.
          - name: "Linux · Make · ROOT + external HepMC3"
            os: ubuntu-latest
            path: system
            root_source: "conda"
            build: make
            cxx: g++
            flags: "IGNORE_CMAKE=1"
            libdir: ""
            ref_job: ref-linux
            golden: golden-linux.hepmc3
            current: current-linux.hepmc3

          # --- macOS: builtin path ---
          # Only runs on workflow_dispatch (filtered below); ref-macos is also
          # workflow_dispatch-only, so golden files are available.
          - name: "macOS · Built-in"
            os: macos-latest
            path: builtin
            root_source: ""
            build: cmake
            cxx: clang++
            flags: "IGNORE_ROOT=1 IGNORE_GSL=1 IGNORE_HEPMC3=1"
            libdir: ""
            ref_job: ref-macos
            golden: golden-macos.hepmc3
            current: current-macos.hepmc3

          # --- macOS: everything Homebrew can provide ---
          # The only leg whose dependencies all come from ONE package
          # manager, and the only one taking ROOT from somewhere other than
          # conda-forge. Both matter.
          #
          # Coherence: RUNPATH is directory-granular, so a prefix holding a
          # parallel set of libraries can supply a dependency nobody asked
          # it for. Every other ROOT leg layers conda-forge over the system
          # packages and is exposed to that; this one has a single prefix
          # and is not.
          #
          # Diversity: every other ROOT leg gets ROOT from conda-forge, so
          # a quirk in that packaging would be invisible across all of
          # them. Homebrew's ROOT is a different build with a different
          # root-config output, which is what marley.pc's rpath filter and
          # the external-RUNPATH harvest both parse.
          #
          # HepMC3 is the vendored copy, not because that is convenient but
          # because it is what a Mac user gets: homebrew-core has no HepMC3
          # formula at all. It exists only in a third-party tap, and making
          # CI depend on one person's repository would trade a tested
          # configuration for an untested dependency.
          - name: "macOS · Homebrew"
            os: macos-latest
            path: homebrew
            root_source: "brew"
            build: cmake
            cxx: clang++
            flags: "IGNORE_HEPMC3=1"
            libdir: ""
            ref_job: ref-macos
            golden: golden-macos.hepmc3
            current: current-macos.hepmc3

          # --- macOS: ROOT with the VENDORED HepMC3 ---
          # macOS resolves shared libraries through the absolute install
          # names recorded in each dylib, not through RUNPATH, so it fails
          # and succeeds for different reasons than Linux does. That is
          # exactly why the external-dependency RUNPATH defect was invisible
          # in local macOS testing. Pairing ROOT with the vendored HepMC3
          # puts @loader_path, -install_name and the ROOT dictionary under
          # test together on the platform where they differ most.
          - name: "macOS · ROOT + built-in HepMC3"
            os: macos-latest
            path: root-builtin
            root_source: "conda"
            build: cmake
            cxx: clang++
            flags: "IGNORE_GSL=1 IGNORE_HEPMC3=1"
            libdir: ""
            ref_job: ref-macos
            golden: golden-macos.hepmc3
            current: current-macos.hepmc3

    steps:
      - name: Check matrix eligibility
        id: eligibility
        # The matrix context is unavailable in job-level if: expressions, so
        # the macOS dispatch-only guard and build_path filter are applied here
        # instead.  All subsequent steps are conditioned on this output.
        run: |
          # The matrix carries libdir as a make ARGUMENT ("libdir=lib64"),
          # because most uses pass it straight to make. Anything needing it
          # as a DIRECTORY must strip the prefix and supply the default --
          # and doing that at each use site has already produced paths like
          # "${RUNNER_TEMP}/a/libdir=lib64/libMARLEY.so" that match nothing.
          # Resolve it once here, before any early exit below, since
          # GITHUB_ENV is read after the step ends either way.
          libdir="${{ matrix.libdir }}"
          libdir="${libdir#libdir=}"
          echo "MARLEY_LIBDIR=${libdir:-lib}" >> "$GITHUB_ENV"

          os="${{ matrix.os }}"
          path="${{ matrix.path }}"
          build="${{ matrix.build }}"
          build_path="${{ github.event.inputs.build_path }}"
          private="${{ github.event.repository.private }}"

          run_it() { echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          skip_it() { echo "skip=true"  >> "$GITHUB_OUTPUT"; exit 0; }

          # Evaluated in this order, and the order is the policy:
          #
          #   1. an explicit workflow_dispatch input always wins;
          #   2. otherwise a PRIVATE repository keeps the cheap matrix, so
          #      nobody starts paying for minutes they were not paying before;
          #   3. otherwise (public) every leg runs. GitHub Actions is free
          #      for public repositories on standard runners, so the mirror
          #      gets the full matrix at no cost.
          #
          # Forks need nothing new here: fork detection already exists, and
          # the one fork-specific degradation -- no access to base-repository
          # caches -- is handled at the golden-file steps.

          # 1. explicit dispatch input
          if [[ -n "${build_path}" ]]; then
            [[ "${build_path}" == "everything" ]] && run_it
            [[ "${build_path}" == "${path}" ]] && run_it
            # "builtin" also selects the ROOT-with-vendored-HepMC3 leg, since
            # that leg is a built-in-HepMC3 build.
            [[ "${build_path}" == "builtin" && "${path}" == "root-builtin" ]] \
              && run_it
            # "system" means "dependencies from the platform's package
            # manager", which on macOS is the homebrew leg.
            [[ "${build_path}" == "system" && "${path}" == "homebrew" ]] \
              && run_it
            skip_it
          fi

          # 2. private repository: exactly today's cheap matrix, so nobody
          #    starts paying for minutes they were not paying before. That
          #    means the single Linux built-in CMake leg -- the Make leg is
          #    NOT included, even though it costs the same, because keeping
          #    the private matrix unchanged is the point. Reach it with a
          #    workflow_dispatch when build.mk needs exercising there.
          if [[ "${private}" == "true" ]]; then
            [[ "${os}" == "ubuntu-latest" \
               && "${path}" == "builtin" \
               && "${build}" == "cmake" ]] && run_it
            skip_it
          fi

          # 3. public repository: everything. The macOS exclusion that used
          #    to live here was written when that leg was the slowest to
          #    provision and had the least MARLEY-specific logic. It is now
          #    the only single-package-manager configuration and the only
          #    one not taking ROOT from conda-forge, so it earns its place.
          run_it

      - name: Check out repository
        if: steps.eligibility.outputs.skip != 'true'
        uses: actions/checkout@v5

      # ROOT is only needed for the system build.

      # Same staging as the reference jobs, for the same two reasons: one
      # place strips comments and blanks, and an empty pattern set is an
      # error rather than a filter that silently matches everything.
      - name: Stage the golden filters
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          src="${GITHUB_WORKSPACE}/.github/golden-filters.txt"
          dst="${RUNNER_TEMP}/golden-patterns.txt"
          if [ ! -s "${src}" ]; then
            echo "ERROR: ${src} is missing or empty" >&2
            exit 1
          fi
          grep -v -e '^#' -e '^$' "${src}" > "${dst}"
          if [ ! -s "${dst}" ]; then
            echo "ERROR: ${src} contains no filter patterns" >&2
            exit 1
          fi
          cat "${dst}"
      - name: Set up Micromamba (ROOT via conda-forge)
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.root_source == 'conda'
        uses: mamba-org/setup-micromamba@v1
        with:
          # environment-file, NOT the inline "environment-spec" that used to
          # be here: that is not an input to this action, GitHub silently
          # ignores unknown "with" keys, and the result was an empty
          # environment created in one second with ROOT absent.
          environment-file: .github/root-env.yml
          cache-environment: true

      # setup-micromamba initialises a shell hook rather than exporting
      # anything, and GitHub's default run shell is
      # "bash --noprofile --norc -eo pipefail", which never sources a
      # profile. So root-config was not on PATH and every ROOT leg silently
      # configured WITHOUT ROOT -- visible only because a later step
      # asserted --use-root was "yes".
      #
      # A login shell is used HERE ONLY, to read the activated environment,
      # and the result is exported through GITHUB_PATH/GITHUB_ENV so every
      # later step keeps the stock shell. Making all 38 steps login shells
      # was the wrong lever: it changes startup behaviour for steps that
      # have nothing to do with ROOT, and differs between the Ubuntu and
      # macOS images.
      #
      # No -e here on purpose. This step's job is to report a path; a
      # non-zero return from something in /etc/profile.d is not a reason to
      # fail the build.
      - name: Put the ROOT environment on PATH
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.root_source == 'conda'
        shell: bash -l {0}
        run: |
          echo "CONDA_PREFIX=${CONDA_PREFIX:-<unset>}"
          if [ -z "${CONDA_PREFIX:-}" ]; then
            echo "ERROR: the micromamba environment is not active; ROOT" \
              "would be silently absent" >&2
            exit 1
          fi
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=${CONDA_PREFIX}" >> "$GITHUB_ENV"
          "${CONDA_PREFIX}/bin/root-config" --version

      - name: Install system dependencies (Linux · system path)
        if: steps.eligibility.outputs.skip != 'true' && matrix.os == 'ubuntu-latest' && matrix.path == 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev libhepmc3-dev

      # gsl is named explicitly even though ROOT depends on it, so that the
      # leg states what MARLEY needs rather than relying on a transitive
      # dependency of something else.
      #
      # hepmc3 is NOT installed here, and was never installable: the
      # previous version of this step asked for a formula homebrew-core
      # does not have. The leg was excluded from public runs and
      # dispatch-only before that, so it never ran and never failed.
      - name: Install dependencies from Homebrew
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.root_source == 'brew'
        run: |
          brew install root gsl
          root-config --version
          root-config --prefix

      - name: Verify compiler
        if: steps.eligibility.outputs.skip != 'true'
        run: ${{ matrix.cxx }} --version

      - name: Build
        if: steps.eligibility.outputs.skip != 'true'
        run: make CXX=${{ matrix.cxx }} ${{ matrix.flags }} ${{ matrix.libdir }}

      - name: Build test binary
        if: steps.eligibility.outputs.skip != 'true'
        run: make test CXX=${{ matrix.cxx }} ${{ matrix.flags }} ${{ matrix.libdir }}

      # This assertion is the INVERSE of the one it replaces, deliberately.
      #
      # It used to require -DMARLEY_FOUND_GSL and -DMARLEY_FOUND_HEPMC3 to
      # appear in marley-config --cflags, treating their presence as proof
      # that the system libraries were used. Those are internal build
      # switches: no installed header tests either of them, and publishing
      # them pushed MARLEY's private build configuration onto every
      # consumer's compile line. The published flags must no longer carry
      # them, so the old check now asserts exactly the leak that was fixed.
      #
      # What the leg actually needs to prove -- that the system libraries
      # really were used rather than the vendored fallbacks -- is recorded
      # by the install receipt, which exists to state what the build did.
      # That check lives in the deployment steps below, where the receipt
      # exists.
      - name: Verify no internal build switches reach the published flags
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          published=$(./build/bin/marley-config --cflags --libs)
          echo "published: ${published}"
          if echo "${published}" | grep -q 'MARLEY_FOUND_'; then
            echo "ERROR: an internal MARLEY_FOUND_* switch reached the" \
              "published flags" >&2
            exit 1
          fi

      - name: Verify ROOT was linked
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.root_source != ''
        run: |
          use_root=$(./build/bin/marley-config --use-root)
          echo "use-root: ${use_root}"
          [ "${use_root}" = "yes" ] \
            || { echo "ERROR: ROOT was not linked"; exit 1; }

      # No MARLEY in the environment. Self-location has to find
      # build/share/marley/data through the build tree's own symlink; if it
      # cannot, that is the defect this work exists to prevent and the test
      # should say so. The ref-* jobs DO set it -- they build the
      # pre-refactor branch, whose Logger throws without it.
      # Which copy of each dependency the test binary actually loads, which
      # is not necessarily the one it compiled against.
      #
      # RUNPATH is directory-granular: a directory gets baked in because one
      # library is needed from it, and every other library in it then takes
      # precedence over the system copies, since the loader searches
      # DT_RUNPATH before its default directories. A prefix holding a whole
      # parallel set of libraries -- conda, Spack, CVMFS -- can therefore
      # supply a dependency nobody asked it for.
      #
      # That is not hypothetical here. The System leg compiles against apt's
      # GSL while taking ROOT from conda-forge, whose root package depends
      # on gsl; if the two share a SONAME, this binary runs against a GSL it
      # was not built against, and martest's chi-squared tests are sensitive
      # enough to notice. Printing the resolution makes that visible instead
      # of leaving it to be guessed at from a failed fit.
      #
      # Informational: it never fails the job, because mixing dependency
      # sources this way is a property of the CI environment rather than a
      # defect in MARLEY.
      - name: Report which libraries the test binary resolves
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          runner.os == 'Linux'
        continue-on-error: true
        run: |
          ldd ./build/bin/martest || true
          echo "--- GSL and HepMC3, specifically ---"
          ldd ./build/bin/martest | grep -Ei 'gsl|hepmc' || echo "(none listed)"

      - name: Unit tests
        if: steps.eligibility.outputs.skip != 'true'
        run: ./build/bin/martest

      # Physics validation: restore the golden file produced by the matching
      # ref-* job and diff it against freshly generated output.
      #
      # 'needs' cannot be indexed dynamically, so Linux and macOS legs are
      # handled by separate conditional steps that reference the two ref jobs
      # by their static names.
      #
      # Linux legs: ref-linux always runs alongside them (on push/PR and
      # workflow_dispatch), so validation runs whenever ref_source != 'none'.
      #
      # macOS legs: ref-macos is workflow_dispatch-only, and macOS test legs
      # are also workflow_dispatch-only, so this is consistent.

      - name: Restore golden file (Linux)
        id: restore-golden-linux
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.os == 'ubuntu-latest' &&
          github.event.inputs.ref_source != 'none' &&
          needs.ref-linux.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.golden }}
          key: ${{ needs.ref-linux.outputs.cache_key }}
          # No restore-keys fallback here: we rely solely on the exact key
          # passed from the ref job.  A prefix fallback could silently restore
          # a golden file from a different reference SHA, defeating the
          # integrity guarantee of the byte-for-byte diff.  If the exact key
          # misses (e.g. first-ever run or a cache service anomaly), the
          # Physics validation step will hard-fail with a clear error.

      - name: Restore golden file (macOS)
        id: restore-golden-macos
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.os == 'macos-latest' &&
          github.event.inputs.ref_source != 'none' &&
          needs.ref-macos.result == 'success'
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.golden }}
          key: ${{ needs.ref-macos.outputs.cache_key }}
          # Same rationale as Linux: no prefix fallback; exact key only.

      - name: Physics validation
        # Run whenever a golden file was requested (ref_source != 'none') and
        # the appropriate ref job was not skipped.  The shell script below
        # handles the missing-file case: hard-fail for internal events, warn
        # and skip for PRs from forks (which cannot read base-repo caches).
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          github.event.inputs.ref_source != 'none' &&
          (needs.ref-linux.result == 'success' ||
           needs.ref-macos.result == 'success')
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          golden="${{ matrix.golden }}"
          if [[ ! -f "${golden}" ]]; then
            if [[ "${IS_FORK_PR}" == "true" ]]; then
              echo "WARNING: golden file not available for fork PR; physics validation skipped"
              exit 0
            fi
            echo "ERROR: golden file '${golden}' not found; cannot perform physics validation" >&2
            exit 1
          fi
          ./build/bin/marley generate examples/config/COPY_ME.js
          grep -v -f "${RUNNER_TEMP}/golden-patterns.txt" \
            events.hepmc3 > ${{ matrix.current }}
          diff "${golden}" ${{ matrix.current }}

      # -----------------------------------------------------------------
      # Deployment (design spec 8.2)
      #
      # Coverage here was deep in one dimension and absent in another:
      # sixteen build configurations, exactly one deployment layout -- the
      # build tree. Neither "make install" nor "cmake --install" ran
      # anywhere. These steps install it, prove the install stands alone,
      # prove it survives being MOVED, and then remove it.
      # -----------------------------------------------------------------
      - name: Install
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          make install CXX=${{ matrix.cxx }} ${{ matrix.flags }} \
            ${{ matrix.libdir }} prefix="${RUNNER_TEMP}/a"
          find "${RUNNER_TEMP}/a" -maxdepth 2 -mindepth 1 \
            -not -path '*/data/*' | sort

      - name: Verify the receipt records what the build actually did
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          receipt="${RUNNER_TEMP}/a/share/marley/install-receipt"
          cat "${receipt}"
          # The question the old --cflags grep was trying to answer, asked
          # of the thing that exists to record it.
          case "${{ matrix.path }}" in
            system)
              grep -q '^hepmc3: external' "${receipt}" \
                || { echo "ERROR: system HepMC3 was not used" >&2; exit 1; }
              grep -q '^gsl: external' "${receipt}" \
                || { echo "ERROR: system GSL was not used" >&2; exit 1; }
              grep -q '^root: yes' "${receipt}" \
                || { echo "ERROR: ROOT was not used" >&2; exit 1; }
              ;;
            homebrew)
              # Homebrew supplies ROOT and GSL; HepMC3 is vendored because
              # homebrew-core has no formula for it.
              grep -q '^hepmc3: builtin' "${receipt}" \
                || { echo "ERROR: the vendored HepMC3 was not used" >&2; exit 1; }
              grep -q '^gsl: external' "${receipt}" \
                || { echo "ERROR: Homebrew's GSL was not used" >&2; exit 1; }
              grep -q '^root: yes' "${receipt}" \
                || { echo "ERROR: ROOT was not used" >&2; exit 1; }
              ;;
            root-builtin)
              # The whole point of this leg: ROOT enabled, HepMC3 vendored.
              grep -q '^hepmc3: builtin' "${receipt}" \
                || { echo "ERROR: the vendored HepMC3 was not used" >&2; exit 1; }
              grep -q '^root: yes' "${receipt}" \
                || { echo "ERROR: ROOT was not used" >&2; exit 1; }
              ;;
            *)
              grep -q '^hepmc3: builtin' "${receipt}" \
                || { echo "ERROR: the vendored HepMC3 was not used" >&2; exit 1; }
              grep -q '^root: no' "${receipt}" \
                || { echo "ERROR: ROOT was enabled on a built-in leg" >&2; exit 1; }
              ;;
          esac
          # libdir is recorded nowhere, so check it where it shows: the
          # library must be under the directory that was asked for. Checked
          # on every leg rather than only the overridden ones, so that the
          # default is verified too -- and so that MARLEY_LIBDIR, which the
          # later steps depend on, is known to be right before they use it.
          ls "${RUNNER_TEMP}/a/${MARLEY_LIBDIR}/libMARLEY."* > /dev/null \
            || { echo "ERROR: nothing installed under ${MARLEY_LIBDIR}/" >&2;
                 exit 1; }
          echo "libdir honoured: ${MARLEY_LIBDIR}/"

      # ---------------------------------------------------------------
      # Published interfaces (design spec 6.3, 6.4)
      #
      # Five cheap checks on legs that have already paid for a build and an
      # install. Each covers an interface that MARLEY publishes and that
      # nothing else in CI exercises: a packager's staged install, the two
      # published flag interfaces, the resolver's command-line face, the
      # environment script, and the ROOT session wrapper. All of them were
      # verified only by hand before this.
      # ---------------------------------------------------------------

      - name: Staged install into DESTDIR
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          # What a distribution packager does: install into a staging tree,
          # then package the contents for unpacking at the real prefix. So
          # DESTDIR must prefix every installed PATH while appearing in no
          # installed FILE -- a staging directory does not exist on the
          # user's machine.
          #
          # On the CMake path this reconfigures the build tree, since the
          # prefix differs from the one configured earlier. That is
          # harmless here: no later step installs again, and the steps that
          # follow use the already-installed prefix in ${RUNNER_TEMP}/a.
          dest="${RUNNER_TEMP}/destdir"
          pfx="/opt/marley-destdir-test"
          make install CXX=${{ matrix.cxx }} ${{ matrix.flags }} \
            ${{ matrix.libdir }} prefix="${pfx}" DESTDIR="${dest}"

          test -x "${dest}${pfx}/bin/marley" \
            || { echo "ERROR: no ${dest}${pfx}/bin/marley after staging" >&2;
                 exit 1; }
          test ! -e "${pfx}" \
            || { echo "ERROR: the staged install wrote to the real ${pfx}" >&2;
                 exit 1; }
          if grep -r -l -a "${dest}" "${dest}${pfx}/bin/" 2>/dev/null \
             | grep -q .; then
            echo "ERROR: the staging path is baked into an installed file" >&2
            grep -r -l -a "${dest}" "${dest}${pfx}/bin/" >&2
            exit 1
          fi
          echo "DESTDIR staging is clean"

      - name: Published flags (pkg-config)
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          command -v pkg-config > /dev/null \
            || { echo "ERROR: pkg-config is absent from this runner" >&2;
                 exit 1; }
          export PKG_CONFIG_PATH="${RUNNER_TEMP}/a/${MARLEY_LIBDIR}/pkgconfig"
          pkg-config --exists marley \
            || { echo "ERROR: no usable marley.pc in ${PKG_CONFIG_PATH}" >&2;
                 exit 1; }
          echo "modversion: $( pkg-config --modversion marley )"
          pc_cflags="$( pkg-config --cflags marley )"
          pc_libs="$( pkg-config --libs marley )"
          echo "--cflags: ${pc_cflags}"
          echo "--libs:   ${pc_libs}"
          case "${pc_libs}" in
            *-lMARLEY*) ;;
            *) echo "ERROR: --libs does not link MARLEY" >&2; exit 1 ;;
          esac
          # A .pc file must carry no rpath. A packager's toolchain manages
          # that, and an rpath here would bake this machine's layout into a
          # redistributed binary (spec 6.3). marley-config may carry one,
          # because a hand-written Makefile has no other way to produce a
          # runnable binary -- so the two interfaces differ by exactly this.
          case "${pc_libs}" in
            *-rpath*) echo "ERROR: marley.pc carries an rpath" >&2; exit 1 ;;
          esac
          # No published interface may name the build tree.
          for flags in "${pc_cflags}" "${pc_libs}"; do
            case "${flags}" in
              *"${GITHUB_WORKSPACE}/build"*)
                echo "ERROR: a published flag names the build tree" >&2
                exit 1 ;;
            esac
          done
          echo "published flags are clean"

      - name: Resolve a data file through the installed CLI
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          # From an unrelated directory, so nothing resolves by accident.
          mkdir -p "${RUNNER_TEMP}/resolve-test"
          cd "${RUNNER_TEMP}/resolve-test"
          "${RUNNER_TEMP}/a/bin/marley" info
          out="$( "${RUNNER_TEMP}/a/bin/marley" info --resolve mass_table.js )"
          echo "${out}"
          case "${out}" in
            *mass_table.js*) ;;
            *) echo "ERROR: --resolve reported no path" >&2; exit 1 ;;
          esac
          # A name that cannot be resolved must exit non-zero. Printing
          # NOT FOUND and exiting 0 would make this useless in a script,
          # which is the only reason it exists.
          if "${RUNNER_TEMP}/a/bin/marley" info --resolve no_such_file.js; then
            echo "ERROR: --resolve exited 0 for a nonexistent file" >&2
            exit 1
          fi
          echo "the resolver CLI behaves"

      - name: The environment script, and the absence of MARLEY
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          cd "${RUNNER_TEMP}"
          . "${RUNNER_TEMP}/a/bin/setup_marley.sh"
          resolved="$( command -v marley )"
          echo "marley resolves to: ${resolved}"
          [ "${resolved}" = "${RUNNER_TEMP}/a/bin/marley" ] \
            || { echo "ERROR: the installed marley is not first on PATH" >&2;
                 exit 1; }
          # The point of the whole data-discovery change: the script sets no
          # MARLEY variable, because nothing reads one any more. Exporting
          # one would quietly reintroduce the dependency this branch removes.
          if [ -n "${MARLEY:-}" ]; then
            echo "ERROR: setup_marley.sh exported MARLEY=${MARLEY}" >&2
            exit 1
          fi
          echo "PATH set, MARLEY left unset"

      - name: Interactive ROOT session (mroot)
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.root_source != ''
        run: |
          cd "${RUNNER_TEMP}"
          # Two things at once, both specific to the INSTALLED tree:
          #
          #   dict -- looking up a dictionary class exercises the rootmap
          #     and ROOT's dynamic path together. The rootmap names the
          #     library as a bare "libMARLEY", so a missing dynamic path
          #     shows up here as a failed autoload even though the library
          #     was loaded by absolute path moments earlier.
          #   hdr  -- parsing a MARLEY header exercises ROOT_INCLUDE_PATH,
          #     without which the library loads but no #include works.
          #
          # EventFileReader.hh specifically: it has a member gated on
          # USE_ROOT, which is why mroot declares that macro before loading
          # anything. If the define were lost, cling would build a class
          # layout disagreeing with the library and read wrong offsets.
          #
          # -e '(int)0;' last is load-bearing: root exits with the value of
          # the final expression, and printf returns a character count.
          out="$( "${RUNNER_TEMP}/a/bin/mroot" -b -q \
            -e 'printf("dict: %s\n", TClass::GetClass("HepMC3::GenEventData") ? "found" : "MISSING");' \
            -e 'printf("hdr: %s\n", gInterpreter->Declare("#include \"marley/EventFileReader.hh\"") ? "ok" : "FAILED");' \
            -e '(int)0;' 2>&1 )"
          echo "${out}"
          # grep -a: ROOT's banner carries UTF-8 that can make grep treat
          # the stream as binary and report nothing.
          printf '%s\n' "${out}" | grep -a -q 'dict: found' \
            || { echo "ERROR: the dictionary class could not be looked up" >&2;
                 exit 1; }
          printf '%s\n' "${out}" | grep -a -q 'hdr: ok' \
            || { echo "ERROR: a MARLEY header did not parse under cling" >&2;
                 exit 1; }
          echo "mroot loads the library and parses MARLEY headers"

      # The stash is the point of increment 1. Without it, an install whose
      # RUNPATH still points into the build directory runs perfectly -- the
      # exact silent breakage that appears if the install-prefix work lands
      # before the RUNPATH work. With it, that ordering hazard becomes a
      # test failure in the commit that causes it.
      - name: Stash the build tree
        if: steps.eligibility.outputs.skip != 'true'
        run: mv build build.stashed

      # Asserts the property directly rather than inferring it from the run
      # below, because the run is about to stop being able to detect it.
      #
      # An installed MARLEY must resolve its dependencies on its own. Today
      # the next step would catch a failure to, but only by accident: these
      # runners happen to leave LD_LIBRARY_PATH unset, so a missing RUNPATH
      # entry is fatal. That accident ends with the move to a ROOT container
      # image, which sets LD_LIBRARY_PATH in the image environment -- and
      # LD_LIBRARY_PATH beats DT_RUNPATH, so a binary with a completely
      # broken RUNPATH would run there and this suite would stay green.
      #
      # Unsetting it here keeps the check meaningful under any environment,
      # present or future. It is deliberately NOT unset for the run itself:
      # the golden diff should exercise the configuration a user would have,
      # and a false red there costs more than it gains.
      #
      # Linux only. macOS records absolute install names in its dylibs and
      # has no equivalent exposure, which is exactly why it never showed the
      # RUNPATH defect this step exists to catch.
      - name: Assert the installed binary needs no environment help
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          runner.os == 'Linux'
        run: |
          status=0
          for f in "${RUNNER_TEMP}/a/bin/marley" \
                   "${RUNNER_TEMP}/a/${MARLEY_LIBDIR}/libMARLEY.so"; do
            # A check that cannot find its subject must fail, not pass. ldd
            # reports a missing file as "No such file or directory", which
            # contains no "not found" and so would have sailed through the
            # test below -- leaving this step green while verifying nothing.
            if [[ ! -e "${f}" ]]; then
              echo "ERROR: ${f} does not exist" >&2
              status=1
              continue
            fi
            echo "::group::ldd ${f}"
            # ldd exits non-zero for a binary with unresolved dependencies,
            # so its status is captured rather than allowed to kill the step
            # before the output is shown.
            out="$( env -u LD_LIBRARY_PATH ldd "${f}" 2>&1 )" || true
            echo "${out}"
            echo "::endgroup::"
            if printf '%s\n' "${out}" | grep -q 'not found'; then
              echo "ERROR: ${f} has unresolved dependencies with" \
                "LD_LIBRARY_PATH unset -- a required directory is missing" \
                "from its RUNPATH" >&2
              status=1
            fi
          done
          exit "${status}"

      - name: Run the installed MARLEY, and diff against the golden file
        if: steps.eligibility.outputs.skip != 'true'
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          # From a temporary directory, with the INSTALLED example
          # configuration: that also proves examples/ shipped, since 14
          # documented commands used to fail on an installed MARLEY.
          mkdir -p "${RUNNER_TEMP}/run-a"
          cd "${RUNNER_TEMP}/run-a"

          # Diagnostics on failure. This step is the first thing that runs an
          # installed binary with the build tree moved aside, so it is where
          # every RUNPATH defect lands -- and a dynamic-loader failure exits
          # before main(), producing a red step with almost no output and a
          # duration of zero. Dumping the RUNPATH and the resolved libraries
          # turns that into a diagnosis without a second CI round trip.
          rc=0
          "${RUNNER_TEMP}/a/bin/marley" generate \
            "${RUNNER_TEMP}/a/share/marley/examples/config/COPY_ME.js" || rc=$?
          if [[ "${rc}" -ne 0 ]]; then
            echo "::group::Loader diagnostics for the installed binary"
            bin="${RUNNER_TEMP}/a/bin/marley"
            lib="${RUNNER_TEMP}/a/${MARLEY_LIBDIR}/libMARLEY.so"
            if [[ "${RUNNER_OS}" == "macOS" ]]; then
              lib="${lib%.so}.dylib"
              otool -l "${bin}" | grep -A 2 LC_RPATH || true
              otool -L "${bin}" || true
              otool -L "${lib}" || true
            else
              readelf -d "${bin}" | grep -Ei 'rpath|runpath' || \
                echo "no RPATH/RUNPATH in ${bin}"
              readelf -d "${lib}" | grep -Ei 'rpath|runpath' || \
                echo "no RPATH/RUNPATH in ${lib}"
              # "not found" lines here name the missing dependency outright.
              ldd "${bin}" || true
              ldd "${lib}" || true
            fi
            echo "::endgroup::"
            echo "ERROR: the installed MARLEY failed to run (exit ${rc})" >&2
            exit "${rc}"
          fi

          golden="${GITHUB_WORKSPACE}/${{ matrix.golden }}"
          if [[ ! -f "${golden}" ]]; then
            if [[ "${IS_FORK_PR}" == "true" ]]; then
              echo "WARNING: no golden file for a fork PR; diff skipped"
              exit 0
            fi
            echo "ERROR: golden file '${golden}' not found" >&2
            exit 1
          fi
          # Every checkpoint diffs, not just the build-tree one. Otherwise
          # CI verifies "build-tree MARLEY is correct" and "installed
          # MARLEY runs", but never "installed MARLEY is correct" -- which
          # is the whole subject of this change.
          grep -v -f "${RUNNER_TEMP}/golden-patterns.txt" \
            events.hepmc3 > current-installed.hepmc3
          diff "${golden}" current-installed.hepmc3

      # Design spec 8.5. Built-in-HepMC3 legs only: the system path merely
      # forwards HepMC3-config's output and has almost no MARLEY-specific
      # logic to get wrong, while the built-in path is where every
      # MARLEY-owned include path lives. CMake legs only, because the Make
      # path installs no CMake package to consume.
      #
      # It runs AFTER the build tree is stashed, so a consumer that only
      # works while the build directory survives fails here.
      - name: Build an external consumer against the installed package
        if: >-
          steps.eligibility.outputs.skip != 'true' &&
          matrix.build == 'cmake' &&
          (matrix.path == 'builtin' || matrix.path == 'root-builtin' ||
           matrix.path == 'homebrew')
        run: |
          cmake -S "${GITHUB_WORKSPACE}/.github/consumer" \
            -B "${RUNNER_TEMP}/consumer-build" \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/a"
          cmake --build "${RUNNER_TEMP}/consumer-build"
          # From a directory unrelated to both the build tree and the
          # prefix, so nothing can be found by accident.
          mkdir -p "${RUNNER_TEMP}/consumer-run"
          cd "${RUNNER_TEMP}/consumer-run"
          "${RUNNER_TEMP}/consumer-build/consumer"
          # The standard must arrive through the imported target rather than
          # being set by the consumer.
          grep -o -- '-std=[^ ]*' \
            "${RUNNER_TEMP}/consumer-build/CMakeFiles/consumer.dir/flags.make" \
            | head -1

      - name: Relocate the installed prefix and run again
        if: steps.eligibility.outputs.skip != 'true'
        env:
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          mv "${RUNNER_TEMP}/a" "${RUNNER_TEMP}/b"
          mkdir -p "${RUNNER_TEMP}/run-b"
          cd "${RUNNER_TEMP}/run-b"
          "${RUNNER_TEMP}/b/bin/marley" generate \
            "${RUNNER_TEMP}/b/share/marley/examples/config/COPY_ME.js"

          golden="${GITHUB_WORKSPACE}/${{ matrix.golden }}"
          if [[ ! -f "${golden}" && "${IS_FORK_PR}" == "true" ]]; then
            echo "WARNING: no golden file for a fork PR; diff skipped"
            exit 0
          fi
          grep -v -f "${RUNNER_TEMP}/golden-patterns.txt" \
            events.hepmc3 > current-moved.hepmc3
          diff "${golden}" current-moved.hepmc3

      # Uninstalling the MOVED tree tests a property nothing else verifies:
      # that relocating an installation does not render it un-removable.
      # An explicit --prefix means no guessing, and --yes means CI cannot
      # hang on the confirmation prompt.
      - name: Uninstall, and assert the prefix is empty
        if: steps.eligibility.outputs.skip != 'true'
        run: |
          "${GITHUB_WORKSPACE}/src/scripts/uninstall-marley" \
            --prefix "${RUNNER_TEMP}/b" --yes
          echo "--- what remains ---"
          find "${RUNNER_TEMP}/b" || true
          leftover=$(find "${RUNNER_TEMP}/b" \( -type f -o -type l \) -print)
          if [ -n "${leftover}" ]; then
            echo "ERROR: the uninstaller left files behind:" >&2
            echo "${leftover}" >&2
            exit 1
          fi

      - name: Restore the build tree
        if: always() && steps.eligibility.outputs.skip != 'true'
        run: |
          if [ -d build.stashed ] && [ ! -d build ]; then
            mv build.stashed build
          fi
